name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Match package-lock.json; includes browsers and Linux system dependencies.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roletrail_test
          POSTGRES_DB: roletrail_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roletrail_test -d roletrail_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROLE_TRAIL_TEST_DATABASE_URL: postgresql://roletrail_test@postgres:5432/roletrail_test
      PLAYWRIGHT_IMAGE_VERSION: '1.64.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        timeout-minutes: 5
      - name: Check browser image matches the locked Playwright version
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, process.env.PLAYWRIGHT_IMAGE_VERSION)"
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm audit
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
        timeout-minutes: 5
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
