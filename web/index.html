<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Role Trail</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Role Trail<span>Your next chapter.</span></a>
      <nav aria-label="Workspace">
        <button data-page="jobs" class="active">Opportunities</button
        ><button data-page="tasks">Preparation</button><button data-page="research">Research</button
        ><button data-page="profile">Profile</button>
      </nav>
      <button id="refresh" class="quiet">Refresh</button>
    </header>
    <main id="main"><p>Loading workspace…</p></main>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-bar">
        <span>OPPORTUNITY</span
        ><button id="close-detail" aria-label="Close opportunity">Close</button>
      </div>
      <div id="detail-body"></div>
    </dialog>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="editor-form">
        <div class="dialog-bar">
          <h2 id="editor-title">Edit</h2>
          <button type="button" id="close-editor">Close</button>
        </div>
        <div class="editor-body" id="editor-body"></div>
        <div class="dialog-footer"><button type="submit" class="primary">Save</button></div>
      </form>
    </dialog>
  </body>
</html>
