<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Role Trail</title>
    <link rel="stylesheet" href="/style.css?v=8c33a7dbd87341d3" />
    <script src="/app.js?v=8c33a7dbd87341d3" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="Skip to content">Skip to content</a>
    <header>
      <a class="brand" href="/">ROLE TRAIL</a>
      <nav aria-label="Workspace">
        <button data-page="jobs" class="active" data-i18n="Opportunities">Opportunities</button
        ><button data-page="tasks" data-i18n="Preparation">Preparation</button
        ><button data-page="research" data-i18n="Research">Research</button>
      </nav>
      <div class="header-actions">
        <button
          id="tools-toggle"
          class="quiet icon-button"
          aria-label="Tools"
          data-i18n-label="Tools"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 6h14M5 12h14M5 18h14" />
          </svg></button
        ><button
          id="profile-toggle"
          class="quiet icon-button"
          aria-label="Profile"
          data-i18n-label="Profile"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 8a3 3 0 1 0 6 0 3 3 0 1 0-6 0M5 21v-3a7 7 0 0 1 14 0v3" />
          </svg></button
        ><button
          id="refresh"
          class="quiet icon-button"
          aria-label="Refresh"
          data-i18n-label="Refresh"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7a8 8 0 0 0-14-2L3 8m0-5v5h5M4 17a8 8 0 0 0 14 2l3-3m0 5v-5h-5" />
          </svg>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <p class="loading" role="status" data-i18n="Loading workspace…">Loading workspace…</p>
    </main>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-bar">
        <span>OPPORTUNITY</span
        ><button
          id="close-detail"
          aria-label="Close opportunity"
          data-i18n-label="Close opportunity"
          class="quiet icon-button"
          type="button"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
        </button>
      </div>
      <div
        id="detail-tabs"
        class="detail-jumps"
        role="tablist"
        aria-label="Opportunity sections"
      ></div>
      <div id="detail-notice" role="status" hidden></div>
      <div id="detail-body"></div>
      <footer id="detail-footer" class="dialog-footer"></footer>
    </dialog>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="editor-form">
        <div class="dialog-bar">
          <h2 id="editor-title" data-i18n="Edit">Edit</h2>
          <button type="button" id="close-editor" data-i18n="Close">Close</button>
        </div>
        <div class="editor-body" id="editor-body"></div>
        <div class="dialog-footer">
          <button type="submit" class="primary" data-i18n="Save">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
